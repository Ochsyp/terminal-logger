# Scans for committed secrets with gitleaks. A push is scanned for the commits it adds, and a pull
# request for its first 30 commits, since the action reads one page of the commit list; both follow
# the first parent and skip merge commits, and a push without commits is not scanned. Only a manual
# run (workflow_dispatch) scans the full history, which fetch-depth: 0 checks out.
# Actions are pinned to commit SHAs; Dependabot proposes updates.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
