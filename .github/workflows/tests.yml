# Runs the bats suite on every pull request, every push to main and on demand, and fails when a
# test is skipped. ShellCheck is pinned and its download checked against its SHA-256, so the
# ShellCheck test always runs. Actions are pinned to commit SHAs; Dependabot proposes updates.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    # A fixed image, so that a move of ubuntu-latest to a new release cannot change the tools.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # An explicit bash adds -o pipefail, so the tee below cannot hide a failing bats run.
        shell: bash
    env:
      BATS_VERSION: 1.13.0
      SHELLCHECK_VERSION: 0.11.0
      # SHA-256 of shellcheck-v0.11.0.linux.x86_64.tar.xz, as GitHub lists it for the release asset.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats and ShellCheck
        run: |
          # A global npm install cannot write to /usr/local on the runner, so bats goes into a
          # temporary prefix that later steps find through GITHUB_PATH.
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/bats" "bats@${BATS_VERSION}"
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          "$RUNNER_TEMP/bats/node_modules/.bin/bats" --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
      - name: Run the tests
        run: bats --tap tests/ | tee "$RUNNER_TEMP/bats.tap"
      - name: Fail on skipped tests
        run: |
          if grep -E '^ok [0-9]+ .* # skip' "$RUNNER_TEMP/bats.tap"; then
            echo "::error::Tests were skipped; every test must run in CI."
            exit 1
          fi
